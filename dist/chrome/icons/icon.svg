<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="#0d0e12" />
  
  <!-- Subtle tactile border -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#252936" stroke-width="8" />

  <!-- Subtle ambient glow -->
  <circle cx="256" cy="256" r="160" fill="url(#sparkGlow)" />

  <!-- Precision Aperture / Geometric Prompt Refiner Ring -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="#1f2330" stroke-width="12" stroke-dasharray="8 8" />

  <!-- Corner alignment ticks -->
  <line x1="256" y1="64" x2="256" y2="92" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="420" x2="256" y2="448" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <line x1="64" y1="256" x2="92" y2="256" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
  <line x1="420" y1="256" x2="448" y2="256" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />

  <!-- Central Sharp 4-Point Spark / Lens -->
  <!-- Shape of a faceted star/lens optimizer -->
  <path d="M 256 128 Q 256 256 128 256 Q 256 256 256 384 Q 256 256 384 256 Q 256 256 256 128 Z" fill="#f59e0b" />
  
  <!-- Inner Core Diamond -->
  <polygon points="256,204 290,256 256,308 222,256" fill="#fffbeb" opacity="0.9" />
  
  <!-- Tiny center pin -->
  <circle cx="256" cy="256" r="6" fill="#0d0e12" />
</svg>